<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024">
  <!-- AppIconic app icon: macOS grid (body 824 px, radius 185.4) with three stacked layers in
       isometric view – an icon is made of layers. Original artwork, MIT like the app. -->
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#2d3c6b"/>
      <stop offset="1" stop-color="#111831"/>
    </linearGradient>
    <linearGradient id="l1" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#6fd6ff"/>
      <stop offset="1" stop-color="#0a84ff"/>
    </linearGradient>
    <linearGradient id="l2" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ffb340"/>
      <stop offset="1" stop-color="#ff375f"/>
    </linearGradient>
    <linearGradient id="l3" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#4be37a"/>
      <stop offset="1" stop-color="#16a3a0"/>
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="125%">
      <feDropShadow dx="0" dy="12" stdDeviation="14" flood-color="#000" flood-opacity="0.35"/>
    </filter>
    <filter id="soft" x="-20%" y="-20%" width="140%" height="160%">
      <feDropShadow dx="0" dy="10" stdDeviation="10" flood-color="#000" flood-opacity="0.35"/>
    </filter>
  </defs>
  <rect x="100" y="100" width="824" height="824" rx="185.4" fill="url(#bg)" filter="url(#shadow)"/>
  <g filter="url(#soft)">
    <polygon points="512,500 762,640 512,780 262,640" fill="url(#l3)" stroke="url(#l3)" stroke-width="56" stroke-linejoin="round" opacity="0.95"/>
    <polygon points="512,380 762,520 512,660 262,520" fill="url(#l2)" stroke="url(#l2)" stroke-width="56" stroke-linejoin="round" opacity="0.95"/>
    <polygon points="512,260 762,400 512,540 262,400" fill="url(#l1)" stroke="url(#l1)" stroke-width="56" stroke-linejoin="round" opacity="0.97"/>
  </g>
  <path d="M512 340 l70 40 l-70 40 l-70 -40 z" fill="#fff" stroke="#fff" stroke-width="18" stroke-linejoin="round" opacity="0.95"/>
  <rect x="100" y="100" width="824" height="824" rx="185.4" fill="none" stroke="#fff" stroke-opacity="0.12" stroke-width="4"/>
</svg>
