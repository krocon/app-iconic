[package]
name = "ai-core"
version = "0.1.0"
description = "AppIconic engine: .icon documents, bundle/ZIP I/O, export, fonts – no Tauri"
authors = ["krocon"]
license = "MIT"
edition = "2024"
rust-version = "1.93"

[dependencies]
serde = { version = "1.0", features = ["derive"] }
# 002 E4: keep the key order of icon.json (lossless round trip)
serde_json = { version = "1.0", features = ["preserve_order"] }
# 002 E17: read/write zipped .icon files; only Deflate (no AES/bzip2/lzma/zstd → unsupported_icon)
zip = { version = "8.6.0", default-features = false, features = ["deflate-flate2-zlib-rs"] }
# 002 E11/E12: NFC comparison of asset names (HFS+ stores NFD)
unicode-normalization = "0.1.25"
# 002 E9: PNG assets as data URLs
base64 = "0.23"
# PNG export (prompt 012): SVG → pixels; usvg, tiny-skia and fontdb are used through its re-exports
resvg = { version = "=0.48.1", default-features = false, features = ["text", "system-fonts", "memmap-fonts", "raster-images"] }

[dev-dependencies]
tempfile = "3"
