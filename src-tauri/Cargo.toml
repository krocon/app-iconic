[workspace]
members = ["core", "mcp"]

[package]
name = "app-iconic"
version = "0.1.0"
description = "Editor for Apple .icon app icons with SVG layers (Tauri 2 + Angular)"
authors = ["krocon"]
license = "MIT"
repository = "https://github.com/krocon/app-iconic"
edition = "2024"
rust-version = "1.93"

[lib]
name = "ai_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.7.3", features = [] }

[dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tauri = { version = "2.12.4", features = [] }
# only the Rust API (open/save dialogs) – the WebView gets no `dialog:` permission (architecture E4)
tauri-plugin-dialog = "2"
tauri-plugin-single-instance = "2"
# window size/position per window label; no WebView permission needed
tauri-plugin-window-state = "2"
# 001 E2: the icon engine (icon.json, bundle/ZIP, export, fonts) – Tauri-free, testable without GTK
ai-core = { path = "core" }
# system clipboard images for paste (prompt 071; no Tauri clipboard plugin for the webview)
arboard = { version = "=3.7.0", default-features = false, features = ["image-data"] }
# 018 E1: bridge protocol and bridge server of the MCP sidecar `app-iconic-mcp`
ai-mcp = { path = "mcp" }

# 003 E11: `-[NSWindow setDocumentEdited:]` (Tauri has no API); already in the tree via tao
[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6"

[dev-dependencies]
tempfile = "3"
