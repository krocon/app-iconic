[package]
name = "ai-mcp"
version = "0.1.0"
description = "MCP server of AppIconic (stdio sidecar `app-iconic-mcp`) and the bridge between it and the running app"
authors = ["krocon"]
license = "MIT"
repository = "https://github.com/krocon/app-iconic"
edition = "2024"
rust-version = "1.93"

[lib]
name = "ai_mcp"
path = "src/lib.rs"

[[bin]]
name = "app-iconic-mcp"
path = "src/main.rs"

[dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

[dev-dependencies]
tempfile = "3"
