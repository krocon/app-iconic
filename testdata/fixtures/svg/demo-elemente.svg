<svg xmlns="http://www.w3.org/2000/svg"
     xmlns:xlink="http://www.w3.org/1999/xlink" width="1024" height="1024" viewBox="0 0 1024 1024">

<!--    <rect x="0" y="0" width="1024" height="1024" fill="#ffffff"/>-->

    <rect fill="red" stroke="black" x="50" y="50" width="100" height="100"/>
    <text x="70" y="85" font-size="12" fill="black">rect</text>

    <circle fill="blue" stroke="black" cx="250.0" cy="100.0" r="50.0"/>
    <text x="220" y="85" font-size="12" fill="black">circle</text>

    <ellipse fill="green" stroke="black" cx="400.0" cy="100.0" rx="50.0" ry="25.0"/>
    <text x="370" y="85" font-size="12" fill="black">ellipse</text>

    <line x1="500" y1="50" x2="600" y2="150" stroke="#e00034" fill="#0098db"/>
    <text x="520" y="85" font-size="12" fill="black">line</text>

    <polyline fill="none" stroke="purple" points="50,225.0 100.0,300 150,225.0"/>
    <text x="70" y="235" font-size="12" fill="black">polyline</text>

    <polygon fill="orange" stroke="black" points="200,300 250.0,200 300,300"/>
    <text x="220" y="235" font-size="12" fill="black">polygon</text>

    <path fill="yellow" stroke="black" d="M 350 200 L 450 200 L 450 300 Z"/>
    <text x="370" y="235" font-size="12" fill="black">path</text>

    <text fill="black" x="520" y="235">text</text>

    <g transform="translate(650,50) scale(0.5)">
        <rect fill="pink" x="0" y="0" width="100" height="100"/>
        <text x="20" y="35" font-size="12" fill="black">rect</text>
    </g>
    <defs>
        <linearGradient id="grad1">
            <stop offset="0%" stop-color="red"/>
            <stop offset="100%" stop-color="blue"/>
        </linearGradient>
        <radialGradient id="grad2">
            <stop offset="0%" stop-color="yellow"/>
            <stop offset="100%" stop-color="green"/>
        </radialGradient>
        <pattern id="pat1" width="20" height="20" patternUnits="userSpaceOnUse">
            <circle cx="10" cy="10" r="5" fill="black"/>
        </pattern>
        <clipPath id="clip1">
            <circle cx="50" cy="25" r="25"/>
        </clipPath>
        <symbol id="sym1" viewBox="0 0 50 50">
            <circle cx="25" cy="25" r="20" fill="gray"/>
        </symbol>
    </defs>
    <rect x="50" y="600" width="100" height="50" fill="url(#grad1)"/>
    <text x="70" y="635" font-size="12" fill="black">linearGradient</text>

    <circle cx="150" cy="650" r="50" fill="url(#grad2)"/>
    <text x="130" y="685" font-size="12" fill="black">radialGradient</text>

    <rect x="250" y="600" width="100" height="50" fill="url(#pat1)"/>
    <text x="270" y="635" font-size="12" fill="white">pattern</text>

    <g clip-path="url(#clip1)">
        <rect x="0" y="0" width="100" height="50" fill="purple"/>
    </g>
    <text x="20" y="635" font-size="12" fill="black">clipPath</text>
    <use xlink:href="#sym1" x="150" y="600"/>
    <text x="160" y="635" font-size="12" fill="black">use/symbol</text>

    <foreignObject x="250" y="650" width="100" height="50">
        <div xmlns="http://www.w3.org/1999/xhtml" style="font-size:12px; color:black;">foreignObject</div>
    </foreignObject>
    <text x="260" y="685" font-size="12" fill="black">foreignObject (HTML)</text>

    <circle cx="350" cy="625" r="25" fill="red">
        <animate attributeName="cx" from="350" to="450" dur="2s" repeatCount="indefinite"/>
    </circle>
    <text x="360" y="660" font-size="12" fill="black">animate</text>
</svg>