    <line y1="0" x1="500" y2="1023" x2="500" stroke="#ffffff" stroke-width="1"/>
    <line y1="0" x1="600" y2="1023" x2="600" stroke="#ffffff" stroke-width="1"/>
    <line y1="0" x1="700" y2="1023" x2="700" stroke="#ffffff" stroke-width="1"/>
    <line y1="0" x1="800" y2="1023" x2="800" stroke="#ffffff" stroke-width="1"/>
    <line y1="0" x1="900" y2="1023" x2="900" stroke="#ffffff" stroke-width="1"/>

    

    <g transform="translate(100,100)">
        <rect id="r_1_1" x="0" y="0" width="10" height="10" fill="#ff0000"/>
        <text x="0" y="0" font-size="18" fill="#ff0000">1.1 Pos (100, 100)</text>

        <g transform="translate(100,100) scale(2,3)">
            <rect id="r_1_2" x="0" y="0" width="10" height="10" fill="#008000"/>
            <text x="0" y="0" font-size="18" fill="#008000">1.2 Pos (200, 200)</text>

            <g transform="translate(100,100)">
                <rect id="r_1_3" x="0" y="0" width="10" height="10" fill="#0000ff"/>
                <text x="0" y="0" font-size="18" fill="#0000ff">1.3 Pos (400, 500)</text>

                <g transform="scale(0.5, 0.333333) translate(100,100)">
                    <rect id="r_1_4" x="0" y="0" width="10" height="10" fill="#ffc0cb"/>
                    <text x="0" y="0" font-size="18" fill="#ffc0cb">1.4 Pos (500, 600)</text>
                </g>
            </g>
        </g>
    </g>

    <g transform="translate(100,100)">
        <rect id="r_2_1" x="0" y="0" width="10" height="10" fill="#ff0000"/>
        <text x="0" y="30" font-size="18" fill="#ff0000">2.1 Pos (100, 100)</text>

        <g transform="scale(2,3) translate(100,100) ">
