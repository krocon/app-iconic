                <g transform="scale(0.5, 0.333333) translate(100,100)">
                    <rect id="r_2_4" x="0" y="0" width="10" height="10" fill="#ffb6c1"/>
                    <text x="0" y="30" font-size="18" fill="#ffb6c1">2.4 Pos (600, 800)</text>
