<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024">

    <rect x="0" y="0" width="1024" height="1024" fill="#000000"/>

    <line x1="0" y1="100" x2="1023" y2="100" stroke="#ffffff" stroke-width="1"/>
    <line x1="0" y1="200" x2="1023" y2="200" stroke="#ffffff" stroke-width="1"/>
    <line x1="0" y1="300" x2="1023" y2="300" stroke="#ffffff" stroke-width="1"/>
